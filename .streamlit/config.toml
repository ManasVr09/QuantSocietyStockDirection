# Quant Society research theme, adapted from the bundled shadcn template.
# A restrained green accent with neutral surfaces and compact typography.

[theme]
base = "light"
primaryColor = "#167C66"
backgroundColor = "#F8F6F2"
secondaryBackgroundColor = "#F0EEE9"
codeBackgroundColor = "#F0EEE9"
textColor = "#252824"
linkColor = "#18181B"
borderColor = "#E4E4E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "full"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#18181B"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true
chartCategoricalColors = ["#16836B", "#A46E35", "#64748B", "#B55252", "#8B7BA8", "#647EAA", "#91988D"]

# shadcn zinc palette
grayColor = "#71717A"
blueColor = "#3B82F6"
greenColor = "#167C66"
redColor = "#A93740"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#8B5CF6"

dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#F0EEE9"
